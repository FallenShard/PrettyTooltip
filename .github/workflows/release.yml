name: Release

on:
  push:
    branches: [main]
    paths:
      - PrettyTooltip_Camelot.toc
      - PrettyTooltip_Mainline.toc
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate release version and prepare notes
        id: version
        run: |
          python - <<'PY'
          import os, pathlib, re
          versions = []
          for name in ("PrettyTooltip_Camelot.toc", "PrettyTooltip_Mainline.toc"):
              text = pathlib.Path(name).read_text()
              version = re.search(r"^## Version: (\d+\.\d+\.\d+)$", text, re.M)
              if not version:
                  raise SystemExit(f"Invalid version in {name}")
              versions.append(version[1])
          if versions[0] != versions[1]:
              raise SystemExit("TOC versions differ")
          tag = "v" + versions[0]
          if os.environ["GITHUB_REF_TYPE"] == "tag" and os.environ["GITHUB_REF_NAME"] != tag:
              raise SystemExit("Tag and TOC versions differ")
          if os.environ["GITHUB_REF_TYPE"] != "tag" and os.environ["GITHUB_REF_NAME"] != "main":
              raise SystemExit("Branch releases must run on main")
          changelog = pathlib.Path("CHANGELOG.md").read_text()
          if not changelog.startswith("# PrettyTooltip " + versions[0] + "\n"):
              raise SystemExit("Changelog and TOC versions differ")
          pathlib.Path("/tmp/release-notes.md").write_text(changelog.split("\n# PrettyTooltip ", 1)[0])
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"tag={tag}\n")
          PY
      - name: Prepare local package tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git rev-parse --verify "refs/tags/$TAG" >/dev/null 2>&1; then
            test "$(git rev-list -n 1 "$TAG")" = "$GITHUB_SHA"
          else
            git tag "$TAG" "$GITHUB_SHA"
          fi
      - name: Build installable ZIP without publishing to other services
        uses: BigWigsMods/packager@v2
        with:
          args: -d
          pandoc: "false"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - name: Verify release ZIP
        run: |
          python -m pip install -r tests/requirements.txt
          python tests/check_package.py
      - name: Publish GitHub release in this fork
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it unchanged."
            exit 0
          fi
          gh release create "$TAG" .release/*.zip \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$TAG" --notes-file /tmp/release-notes.md --latest
